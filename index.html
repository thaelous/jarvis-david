<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Jarvis by David Ramírez</title>
    <meta name="description" content="Simulador interactivo 3D de ensamble y desensamble mecánico con visualización CAD, despiece con explosión gradual y auto-acople magnético." />
    <meta property="og:title" content="Jarvis by David Ramírez" />
    <meta property="og:description" content="Simulador interactivo 3D de ensamble y desensamble mecánico con visualización CAD, despiece con explosión gradual y auto-acople magnético." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Metadatos de Sistema PWA & Capacidades Standalone para Android e iOS -->
    <meta name="theme-color" content="#00e5ff" />
    <meta name="background-color" content="#070b13" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Jarvis by David Ramírez" />
    <meta name="application-name" content="Jarvis by David Ramírez" />

    <!-- Fuentes Externas Seguras (Google Fonts HTTPS) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=JetBrains+Mono:wght@300;400;500;600;700&family=Orbitron:wght@500;700;800;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet" />

    <!-- Iconos de Aplicación Oficial (david.jpeg) -->
    <link rel="icon" type="image/jpeg" href="./david.jpeg" />
    <link rel="shortcut icon" href="./david.jpeg" />
    <link rel="apple-touch-icon" href="./david.jpeg" />

    <!-- Web App Manifest Oficial para Instalabilidad PWA en Android -->
    <link rel="manifest" href="./manifest.json" />

    <!-- Script de Registro Seguro de Service Worker (Sin Blobs, Compatible 100% con Netlify y Android Offline) -->
    <script>
      (function() {
        if ('serviceWorker' in navigator && (window.location.protocol === 'https:' || window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1')) {
          window.addEventListener('load', function() {
            navigator.serviceWorker.register('./sw.js', { scope: './' })
              .then(function(registration) {
                console.log('[PWA] Service Worker registrado exitosamente. Ámbito:', registration.scope);
              })
              .catch(function(error) {
                console.warn('[PWA] Registro de Service Worker omitido o restringido por el entorno:', error);
              });
          });
        }
      })();
    </script>
  </head>
  <body class="light-mode antialiased overflow-hidden select-none touch-none-viewport">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
